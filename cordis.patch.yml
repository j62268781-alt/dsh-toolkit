# One bundle, ten independently managed component package identities,
# plus the external ds-harness-remote host, mounted through ./remote-host.js so its
# own browser UI stays off and the bundle keeps a single unified entry.
- insert:
    - id: dsh-toolkit-boot
      name: dsh-toolkit-boot
    - id: dsh-toolkit-theme
      name: dsh-toolkit-theme
    - id: dsh-toolkit-archived
      name: dsh-toolkit-archived
    - id: dsh-toolkit-browser
      name: dsh-toolkit-browser
    - id: dsh-toolkit-judgment
      name: dsh-toolkit-judgment
    - id: dsh-toolkit-mobile
      name: dsh-toolkit-mobile
    - id: dsh-toolkit-skills-mcp
      name: dsh-toolkit-skills-mcp
    - id: dsh-toolkit-notification
      name: dsh-toolkit-notification
    - id: dsh-toolkit-pet
      name: dsh-toolkit-pet
    - id: dsh-toolkit-remote
      name: dsh-toolkit-remote
    - id: ds-harness-remote
      name: dsh-toolkit/remote-host
      inject:
        - webServer
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
