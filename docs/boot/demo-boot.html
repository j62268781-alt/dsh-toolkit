<title>启动画面 · dsh-shell-kit</title>
<!-- 由 scripts/build-boot-demo.mjs 生成，请勿手改；改 host/boot.* 后重新生成。 -->
<style>
  /* ═══════════════════════════════════════════════════════════════════════
     dsh-shell-kit · 启动画面（boot）
  
     这一段由 Host 半个插件注入到 index.html 的 <head>，在 React 挂载之前
     就已经生效，所以它必须：只用 CSS、只用内联 SVG、不依赖任何运行时。
  
     颜色取自主题注入的 --dsh-boot-bg 与 body[data-ds-dark-theme]，这两样
     在 ui-theme 的 boot 注入里已经设好，早于本样式表读取。
     ═══════════════════════════════════════════════════════════════════════ */
  
  body {
    --sk-ink: #0f1115;
    --sk-ink-2: #61666b;
    --sk-grid: rgba(15, 17, 21, .05);
  }
  
  body[data-ds-dark-theme] {
    --sk-ink: #f9fafb;
    --sk-ink-2: #cfd3d6;
    --sk-grid: rgba(249, 250, 251, .045);
  }
  
  /* 自带的 loading 卡片让位：它仍是"应用是否挂载完成"的信号，只是不显示 */
  [data-dsh-boot] {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  
  /* 万一 6 秒内应用没起来，把自带 loading 卡片还回去（本插件只负责好看，不劫持失败态） */
  html[data-sk-boot-bailed] [data-dsh-boot] {
    opacity: 1 !important;
    pointer-events: auto !important;
  }
  
  .sk-boot {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: grid;
    place-items: center;
    background: var(--dsh-boot-bg, #ffffff);
    transition: opacity 280ms ease-in;
    will-change: opacity;
  }
  
  .sk-boot[data-sk-leaving] { opacity: 0; }
  
  .sk-boot__grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--sk-grid) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0;
    animation: sk-grid-in 900ms ease-out 40ms both;
    -webkit-mask-image: radial-gradient(58% 58% at 50% 50%, #000 20%, transparent 76%);
            mask-image: radial-gradient(58% 58% at 50% 50%, #000 20%, transparent 76%);
  }
  
  .sk-boot__lockup {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  
  .sk-boot__mark {
    width: 92px;
    height: auto;
    overflow: visible;
    color: var(--sk-ink);
  }
  
  /* 第一笔：描边把鲸鱼轮廓画出来（pathLength=1，dash 进度与真实长度无关） */
  .sk-boot__trace {
    fill: none;
    stroke: currentColor;
    stroke-width: .44;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: sk-trace 680ms cubic-bezier(.38, .12, .3, 1) 110ms both,
               sk-trace-out 240ms ease-in 780ms both;
  }
  
  /* 第二笔：画完再填成实心 */
  .sk-boot__fill {
    fill: currentColor;
    opacity: 0;
    animation: sk-fill-in 400ms ease-out 760ms both;
  }
  
  .sk-boot__wordmark {
    font: 600 13px/1.2 -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--sk-ink);
    white-space: nowrap;
    opacity: 0;
    animation: sk-wm-in 520ms cubic-bezier(.22, .61, .36, 1) 950ms both,
               sk-wm-track 760ms cubic-bezier(.22, .61, .36, 1) 950ms both;
  }
  
  .sk-boot__wordmark b {
    font-weight: 500;
    color: var(--sk-ink-2);
  }
  
  @keyframes sk-grid-in { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
  @keyframes sk-trace { to { stroke-dashoffset: 0; } }
  @keyframes sk-trace-out { to { opacity: 0; } }
  @keyframes sk-fill-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sk-wm-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes sk-wm-track { from { letter-spacing: .42em; } to { letter-spacing: .26em; } }
  /* 系统里关掉动效时，只留淡入淡出 */
  @media (prefers-reduced-motion: reduce) {
    .sk-boot__grid,
    .sk-boot__mark .sk-boot__trace,
    .sk-boot__mark .sk-boot__fill,
    .sk-boot__wordmark {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
    }
  }
</style>
<style>

  /* 演示里画面不淡出：停在最后一帧更利于比对 */
  .sk-boot { transition: none !important; }
</style>

<div class="demo-hint">滚轴可逐帧停看：描线 110–780ms · 填色 760–1160ms · 字标 950–1470ms · 退场 1700ms + 280ms</div>
<div class="demo-bar">
  <button id="play" aria-pressed="true">暂停</button>
  <input id="seek" type="range" min="0" max="1980" step="10" value="1700">
  <output id="t"></output>
  <button id="theme">浅色 / 深色</button>
</div>
<script>
  document.documentElement.classList.add('demo');
  var MIN_SHOW = 1700, FADE = 280;
  var boot = document.querySelector('.sk-boot');
  var seek = document.getElementById('seek');
  var out = document.getElementById('t');
  var playing = false, raf = 0, t = MIN_SHOW;

  // 演示页里没有真正的宿主，靠自己「假就绪」：直接改写进度条与淡出
  function animations() { return document.getAnimations(); }

  function apply(ms) {
    t = ms;
    seek.value = String(ms);
    out.textContent = ms + 'ms';
    // CSS 动画带着 delay，currentTime 从动画起点算，所以直接对齐即可
    for (const a of animations()) {
      a.pause();
      try { a.currentTime = ms; } catch (e) { /* 已结束的动画忽略 */ }
    }
    // 淡出：演示里手动模拟宿主在 MIN_SHOW 之后收场
    boot.toggleAttribute('data-sk-leaving', ms >= MIN_SHOW);
    boot.style.opacity = ms >= MIN_SHOW ? String(Math.max(0, 1 - (ms - MIN_SHOW) / FADE)) : '1';
  }

  function tick() {
    if (!playing) return;
    var next = t + 16;
    if (next > MIN_SHOW + FADE) next = 0;
    apply(next);
    raf = requestAnimationFrame(tick);
  }

  function play() {
    playing = true;
    document.getElementById('play').setAttribute('aria-pressed', 'true');
    document.getElementById('play').textContent = '暂停';
    apply(t >= MIN_SHOW + FADE ? 0 : t);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    playing = false;
    document.getElementById('play').setAttribute('aria-pressed', 'false');
    document.getElementById('play').textContent = '播放';
    cancelAnimationFrame(raf);
  }

  document.getElementById('play').onclick = function () { playing ? pause() : play(); };
  seek.oninput = function () { pause(); apply(Number(seek.value)); };
  document.getElementById('theme').onclick = function () {
    document.body.toggleAttribute('data-ds-dark-theme');
  };
  addEventListener('keydown', function (e) { if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); } });

  // 让所有动画先实例化，再停在目标帧
  apply(MIN_SHOW);

  window.__boot = {
    at: function (ms) { pause(); apply(ms); },
    play: play,
    pause: pause,
    MIN_SHOW: MIN_SHOW,
    FADE: FADE
  };
</script>
