<!doctype html>
<html lang="zh-CN" data-platform="darwin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEEPSEEK HARNESS · 鲸鱼出水 → 收成 logo → 抖一下</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   鲸鱼出水 → 收拢成品牌 logo → 锁定抖一下（启动 splash demo · v2）
   -----------------------------------------------------------------------
   和 v1 的区别：鲸鱼不再扎回海面，而是飞向画面中心、缩小、收成品牌标，
   字标随后从右侧浮现；落定的瞬间有一记「抖动 + 冲击波」。

   时间轴（毫秒）：
     0     黑场、水下辉光渐亮
     200   鲸鱼出水：左下角炸开一簇水花
     220   起飞：沿弧线向右上，边飞边缩小
     1500  到位：缩到 logo 尺寸，闪光 + 冲击波 + 抖一下
     1560  字标浮现（字距收拢）
     1750  进度条与文案出现，自行推进到 88%
     3600  demo 模拟「宿主就绪」→ 补满 100% + 淡出
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --sea-deep: #02080f;
  --sea-mid: #061a2b;
  --sea-top: #0d3a58;
  --whale: #eef7ff;
  --foam: #cbe6ff;
  --hud: rgba(233, 244, 255, .92);
  --hud-dim: rgba(197, 219, 240, .62);
  --ease-out: cubic-bezier(.22, .68, .3, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color: var(--hud);
  -webkit-font-smoothing: antialiased;
}

/* ── 舞台 ────────────────────────────────────────────────────────────── */
.splash {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(120% 85% at 50% 118%, #12496c 0%, var(--sea-top) 26%,
      var(--sea-mid) 52%, var(--sea-deep) 78%, #010509 100%);
}

.splash::before {
  content: "";
  position: absolute;
  inset: 0 0 40% 0;
  background: radial-gradient(80% 70% at 50% 100%,
    rgba(111, 188, 255, .13), transparent 70%);
  pointer-events: none;
}

.halo {
  position: absolute;
  left: 50%;
  bottom: 6%;
  width: min(78vw, 980px);
  aspect-ratio: 1.9;
  translate: -50% 0;
  border-radius: 50%;
  background: radial-gradient(closest-side,
    rgba(126, 200, 255, .30), rgba(88, 160, 235, .10) 55%, transparent 72%);
  filter: blur(18px);
  animation: halo 3.4s var(--ease-out) both;
}

@keyframes halo {
  0%   { opacity: 0; transform: scale(.82); }
  45%  { opacity: 1; transform: scale(1); }
  100% { opacity: .78; transform: scale(1.05); }
}

/* ── 海面（盖在鲸鱼上面，出水的那一下才「破水而出」） ────────────────── */
.sea {
  position: absolute;
  inset: auto 0 0 0;
  height: 38vh;
  z-index: 4;
  pointer-events: none;
}

.sea__fill {
  position: absolute;
  inset: auto 0 0 0;
  height: 100%;
  background: linear-gradient(to bottom,
    rgba(30, 96, 146, 0) 0%, rgba(27, 90, 136, .55) 5%,
    rgba(19, 68, 108, .88) 13%, rgba(12, 46, 74, .99) 26%,
    #05131f 52%, #02080e 82%, #010508 100%);
}

.sea__wave {
  position: absolute;
  left: -25%;
  width: 150%;
  height: 100%;
  display: block;
}
.sea__wave--back  { top: -1%; opacity: .38; animation: drift 11s ease-in-out infinite alternate; }
.sea__wave--mid   { top: 1%;  opacity: .55; animation: drift 8.5s ease-in-out infinite alternate-reverse; }
.sea__wave--front { top: 3%;  opacity: .95; animation: drift 6.4s ease-in-out infinite alternate; }

.sea__wave path {
  fill: #061a2b;
  stroke: rgba(176, 222, 255, .30);
  stroke-width: 1.1;
  vector-effect: non-scaling-stroke;
}
.sea__wave--back  path { fill: #0c3550; stroke: rgba(170, 216, 255, .18); }
.sea__wave--mid   path { fill: #08283f; stroke: rgba(176, 222, 255, .26); }
.sea__wave--front path { stroke: rgba(198, 232, 255, .45); }

@keyframes drift {
  from { transform: translateX(-3.5%) translateY(0); }
  to   { transform: translateX(3.5%) translateY(-1.4%); }
}

.sea__mist {
  position: absolute;
  inset: -26px 0 auto 0;
  height: 90px;
  background: linear-gradient(to top, rgba(120, 186, 240, .16), transparent 78%);
  filter: blur(7px);
}

.sea__shine {
  position: absolute;
  left: 50%;
  top: -2px;
  width: min(46vw, 560px);
  height: 3px;
  translate: -50% 0;
  border-radius: 50%;
  background: linear-gradient(90deg, transparent, rgba(190, 228, 255, .85), transparent);
  filter: blur(2px);
  animation: shine 3.4s var(--ease-out) both;
}
@keyframes shine { 0%, 12% { opacity: 0; } 55% { opacity: .9; } 100% { opacity: .5; } }

/* ── 主角：鲸鱼 → logo ──────────────────────────────────────────────── */
.stage {
  position: absolute;
  inset: 0;
  z-index: 2;             /* 低于 .sea：起飞那一下会被海面挡住 */
  display: grid;
  place-items: center;
  pointer-events: none;
}

/*
 * lockup 就是动画结束时的最终状态：品牌标 + 字标，水平居中锁死。
 * 鲸鱼三层 wrapper 各自把「位移 / 姿态与缩放」从起始值归零，
 * 归零之后它天然就落在 logo 的位置上 —— 不需要算像素。
 */
.lockup {
  display: flex;
  align-items: center;
  gap: 14px;
  transform-origin: 50% 50%;
  animation: lock-shake 520ms cubic-bezier(.36, .07, .19, .97) 1490ms both;
}

.arc-x {
  animation: arc-x 1280ms cubic-bezier(.32, .02, .5, 1) 220ms both;
  will-change: transform;
}

.arc-y {
  animation: arc-y 1280ms cubic-bezier(.34, .02, .46, 1) 220ms both;
  will-change: transform;
}

.arc-rot {
  animation: arc-rot 1280ms cubic-bezier(.3, .02, .5, 1) 220ms both;
  will-change: transform;
}

.mark {
  display: block;
  width: 84px;
  height: auto;
  color: var(--whale);
  /* 鲸鱼本来朝左；翻转写在元素自身，父级 rotate 才不会被镜像 */
  transform: scaleX(-1);
  filter:
    drop-shadow(0 0 10px rgba(150, 210, 255, .55))
    drop-shadow(0 0 34px rgba(96, 168, 255, .34));
}

/* 横向：从左下角飞向中心 */
@keyframes arc-x {
  0%   { transform: translateX(-40vw); }
  100% { transform: translateX(0); }
}

/* 纵向：出水 → 过冲一点点 → 落到中心 */
@keyframes arc-y {
  0%   { transform: translateY(44vh); }
  46%  { transform: translateY(-5vh); }
  68%  { transform: translateY(-8vh); }
  86%  { transform: translateY(1.2vh); }
  100% { transform: translateY(0); }
}

/* 姿态 + 缩放：昂头起飞 → 放平 → 收成 logo 尺寸（末段轻微过冲） */
@keyframes arc-rot {
  0%   { transform: rotate(-40deg) scale(2.9); }
  24%  { transform: rotate(-22deg) scale(2.72); }
  48%  { transform: rotate(-4deg) scale(2.3); }
  74%  { transform: rotate(7deg) scale(1.42); }
  90%  { transform: rotate(-2.5deg) scale(.93); }
  100% { transform: rotate(0deg) scale(1); }
}

/* 「抖一下」：落定后的三下渐弱冲击 */
@keyframes lock-shake {
  0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
  12%  { transform: translate(-4px, 3px) rotate(-1.6deg) scale(1.05); }
  28%  { transform: translate(4px, -3px) rotate(1.4deg) scale(1.03); }
  44%  { transform: translate(-3px, 1.6px) rotate(-.9deg) scale(1.016); }
  60%  { transform: translate(2px, -1.2px) rotate(.6deg) scale(1.008); }
  78%  { transform: translate(-1px, .6px) rotate(-.28deg) scale(1.003); }
  100% { transform: translate(0, 0) rotate(0deg) scale(1); }
}

/* ── 字标 ───────────────────────────────────────────────────────────── */
.wordmark {
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap;
  opacity: 0;
  animation: wordmark-in 620ms var(--ease-out) 1500ms both;
}

.wordmark__name {
  font-size: 19px;
  font-weight: 650;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: #fff;
  animation: tracking 620ms var(--ease-out) 1500ms both;
}

.wordmark__suffix {
  padding: 2px 7px 3px;
  border: 1px solid rgba(255, 255, 255, .5);
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .16em;
  color: rgba(255, 255, 255, .82);
}

@keyframes wordmark-in {
  0%   { opacity: 0; filter: blur(10px); transform: translateX(-10px); }
  100% { opacity: 1; filter: blur(0); transform: translateX(0); }
}

@keyframes tracking {
  0%   { letter-spacing: .34em; opacity: .4; }
  100% { letter-spacing: .14em; opacity: 1; }
}

/* ── 落定瞬间的闪光与冲击波 ──────────────────────────────────────────── */
.mark-slot {
  position: relative;
  width: 84px;
  height: 84px;
  display: grid;
  place-items: center;
  flex: none;
}

.shock-layer {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

.shock {
  position: absolute;
  width: 84px;
  height: 84px;
  margin: -42px 0 0 -42px;
  border-radius: 50%;
  border: 1.5px solid rgba(198, 232, 255, .85);
  opacity: 0;
  z-index: 5;
  pointer-events: none;
  animation: shock 1100ms cubic-bezier(.2, .7, .35, 1) both;
}
.shock--2 { animation-delay: 120ms; border-color: rgba(160, 210, 255, .55); }
.shock--3 { animation-delay: 260ms; border-color: rgba(130, 190, 245, .35); }

@keyframes shock {
  0%   { transform: scale(.35); opacity: 0; }
  14%  { opacity: .95; }
  100% { transform: scale(4.6); opacity: 0; }
}

.flash {
  position: absolute;
  inset: 0;
  z-index: 8;
  background: radial-gradient(34% 24% at 50% 50%, rgba(226, 243, 255, .62), rgba(200, 232, 255, 0) 70%);
  opacity: 0;
  pointer-events: none;
  animation: flash 560ms ease-out 1490ms both;
}
@keyframes flash {
  0%   { opacity: 0; }
  12%  { opacity: .8; }
  38%  { opacity: .35; }
  100% { opacity: 0; }
}

/* ── 水花 ───────────────────────────────────────────────────────────── */
.fx {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

.drop {
  position: absolute;
  width: var(--s, 6px);
  height: var(--s, 6px);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, var(--foam) 60%, rgba(150, 200, 240, .2));
  opacity: 0;
  animation: drop var(--dur, 900ms) cubic-bezier(.16, .7, .4, 1) var(--delay, 0ms) both;
}

@keyframes drop {
  0%   { transform: translate(0, 0) scale(.5); opacity: 0; }
  12%  { opacity: 1; }
  52%  { transform: translate(var(--dx, 0px), calc(-1 * var(--up, 90px))) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx2, 0px), var(--down, 24px)) scale(.35); opacity: 0; }
}

.foam {
  position: absolute;
  width: 120px;
  height: 40px;
  margin: -20px 0 0 -60px;
  border-radius: 50%;
  background: radial-gradient(closest-side, #ffffff, rgba(196, 232, 255, .55) 45%, transparent 72%);
  filter: blur(5px);
  opacity: 0;
  animation: foam 880ms cubic-bezier(.2, .7, .4, 1) var(--delay, 0ms) both;
}
@keyframes foam {
  0%   { transform: scale(.25); opacity: .95; }
  55%  { transform: scale(1.15); opacity: .55; }
  100% { transform: scale(2.2); opacity: 0; }
}

.ripple {
  position: absolute;
  width: 40px;
  height: 12px;
  margin-left: -20px;
  border: 1.5px solid rgba(186, 226, 255, .6);
  border-radius: 50%;
  opacity: 0;
  animation: ripple 1500ms cubic-bezier(.2, .7, .35, 1) var(--delay, 0ms) both;
}
@keyframes ripple {
  0%   { transform: scale(.25); opacity: 0; }
  18%  { opacity: .85; }
  100% { transform: scale(9); opacity: 0; }
}

/* ── HUD（在 logo 下方，压在海面之上） ───────────────────────────────── */
.hud {
  position: absolute;
  left: 50%;
  bottom: 12vh;
  translate: -50% 0;
  z-index: 7;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
}

.meter {
  width: min(340px, 56vw);
  display: flex;
  align-items: center;
  gap: 12px;
  opacity: 0;
  animation: rise 700ms var(--ease-out) 1750ms both;
}

.meter__track {
  position: relative;
  flex: 1;
  height: 2px;
  border-radius: 2px;
  background: rgba(190, 222, 250, .16);
  overflow: hidden;
}

.meter__bar {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, rgba(140, 205, 255, .55), #fff);
  box-shadow: 0 0 12px rgba(140, 205, 255, .8);
  transition: width 560ms var(--ease-out);
}

.meter__pct {
  width: 42px;
  text-align: right;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--hud-dim);
}

.stage-text {
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--hud-dim);
  opacity: 0;
  animation: rise 700ms var(--ease-out) 1820ms both;
}

@keyframes rise {
  0%   { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: translateY(0); }
}

.hint {
  position: absolute;
  right: 22px;
  bottom: 20px;
  z-index: 9;
  font-size: 11px;
  letter-spacing: .06em;
  color: rgba(206, 228, 246, .55);
  animation: rise 600ms ease-out 1500ms both;
}

.splash.is-out {
  animation: veil-out 620ms var(--ease-out) both;
  pointer-events: none;
}
@keyframes veil-out {
  from { opacity: 1; filter: blur(0); }
  to   { opacity: 0; filter: blur(6px); }
}

/* ── 演示结束态 ─────────────────────────────────────────────────────── */
.after {
  position: fixed;
  inset: 0;
  z-index: 9;
  display: none;
  place-items: center;
  background: radial-gradient(120% 90% at 50% 30%, #10222f 0%, #070e15 60%, #03070b 100%);
}

.after__card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 30px 38px;
  border: 1px solid rgba(160, 200, 235, .16);
  border-radius: 14px;
  background: rgba(16, 30, 44, .55);
  backdrop-filter: blur(10px);
  text-align: center;
}

.after__ok { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: rgba(196, 226, 255, .9); }
.after__note { font-size: 12px; line-height: 1.7; color: rgba(178, 202, 224, .62); }

.replay {
  padding: 7px 13px;
  border: 1px solid rgba(190, 222, 250, .3);
  border-radius: 999px;
  background: rgba(10, 24, 38, .6);
  color: rgba(226, 240, 255, .92);
  font: inherit;
  font-size: 12px;
  letter-spacing: .04em;
  cursor: pointer;
}
.replay:hover { border-color: rgba(190, 222, 250, .6); background: rgba(16, 36, 56, .8); }

body.show-after .after { display: grid; }

/* 无障碍 */
@media (prefers-reduced-motion: reduce) {
  .arc-x, .arc-y, .arc-rot, .lockup, .halo, .sea__wave, .sea__shine,
  .wordmark, .wordmark__name, .meter, .stage-text, .shock, .flash, .hint {
    animation-duration: 1ms !important;
    animation-delay: 0ms !important;
  }
  .arc-x, .arc-y, .arc-rot { animation-name: none !important; }
  .drop, .ripple, .foam { display: none; }
}
</style>
</head>

  <div class="halo"></div>

  <!-- 鲸鱼（最终会收成左边的品牌标） -->
  <div class="stage">
    <div class="lockup" id="lockup">
      <div class="mark-slot">
        <div class="arc-x">
        <div class="arc-y">

            </svg>

        </div>
      </div>

      <div class="wordmark">
        <span class="wordmark__name">DEEPSEEK</span>
        <span class="wordmark__suffix">HARNESS</span>
      </div>
    </div>
  </div>

  <!-- 海面 -->
  <div class="sea">
    <div class="sea__fill"></div>
    <svg class="sea__wave sea__wave--back" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,26 C160,6 320,6 480,26 C640,46 800,46 960,26 C1120,6 1280,6 1440,26 L1440,200 L0,200 Z"/>
    </svg>
    <svg class="sea__wave sea__wave--mid" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,40 C180,22 340,22 520,40 C700,58 880,58 1060,40 C1220,24 1340,24 1440,38 L1440,200 L0,200 Z"/>
    </svg>
    <svg class="sea__wave sea__wave--front" viewBox="0 0 1440 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,52 C200,34 360,34 540,52 C720,70 900,70 1080,52 C1260,34 1360,36 1440,48 L1440,200 L0,200 Z"/>
    </svg>
    <div class="sea__mist"></div>
    <div class="sea__shine"></div>
  </div>

  <div class="fx" id="fx"></div>
  <div class="shock-layer" id="shockLayer"></div>
  <div class="flash"></div>

  <div class="hud">
    <div class="meter">
      <div class="meter__track"><div class="meter__bar" id="bar"></div></div>
      <div class="meter__pct" id="pct">0%</div>
    </div>
    <div class="stage-text" id="stageText">正在唤醒内核</div>
  </div>

  <div class="hint">点击任意处 或按 Esc 跳过</div>
</div>

<div class="after" id="after">
  <div class="after__card">
    <div class="after__ok">启动完成</div>
    <div class="after__note">真实插件里，这一刻之后露出的是 DSH 主界面。<br>动画总长约 4.2s，其中「就绪」由宿主决定。</div>
    <button class="replay" id="replay" type="button">↻ 重播动画</button>
  </div>
</div>

<script>
(() => {
  const splash = document.getElementById('splash');
  const fx = document.getElementById('fx');
  const bar = document.getElementById('bar');
  const pct = document.getElementById('pct');
  const stageText = document.getElementById('stageText');

  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let raf = 0;
  let finished = false;
  let timers = [];

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  /* ── 水花：随机水滴 + 涟漪 + 一团泡沫 ─────────────────────────────── */
  function splashAt(x, y, count, strength) {
    if (REDUCED) return;
    for (let i = 0; i < count; i++) {
      const drop = document.createElement('span');
      drop.className = 'drop';
      const spread = (Math.random() - 0.5) * 2 * (48 * strength);
      drop.style.left = `${x}px`;
      drop.style.top = `${y}px`;
      drop.style.setProperty('--s', `${3 + Math.random() * 6}px`);
      drop.style.setProperty('--dx', `${spread * 0.55}px`);
      drop.style.setProperty('--dx2', `${spread}px`);
      drop.style.setProperty('--up', `${40 + Math.random() * 130 * strength}px`);
      drop.style.setProperty('--down', `${10 + Math.random() * 30}px`);
      drop.style.setProperty('--dur', `${620 + Math.random() * 520}ms`);
      drop.style.setProperty('--delay', `${Math.random() * 90}ms`);
      drop.addEventListener('animationend', () => drop.remove());
      fx.appendChild(drop);
    }

    const foam = document.createElement('span');
    foam.className = 'foam';
    foam.style.left = `${x}px`;
    foam.style.top = `${y}px`;
    foam.addEventListener('animationend', () => foam.remove());
    fx.appendChild(foam);

    for (let i = 0; i < 3; i++) {
      const ring = document.createElement('span');
      ring.className = 'ripple';
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;
      ring.style.setProperty('--delay', `${i * 160}ms`);
      ring.addEventListener('animationend', () => ring.remove());
      fx.appendChild(ring);
    }
  }

  /* 起飞点 = 动画起始时鲸鱼所在的位置（中心 - 40vw, + 44vh 附近的水面） */
  function exitPoint() {
    return {
      x: window.innerWidth * 0.5 - window.innerWidth * 0.40,
      y: window.innerHeight * 0.5 + window.innerHeight * 0.22,
    };
  }

  /* ── 时间线 ──────────────────────────────────────────────────────── */
  function start() {
    finished = false;
    bar.style.width = '0%';
    pct.textContent = '0%';
    stageText.textContent = '正在唤醒内核';

    const p = exitPoint();
    at(220, () => splashAt(p.x, p.y, 20, 1.15));
    at(1500, burstShock);

    const t0 = performance.now() + 1750;
    const advance = (now) => {
      if (finished) return;
      const k = Math.min(1, Math.max(0, (now - t0) / 1900));
      const v = Math.round(88 * (1 - Math.pow(1 - k, 2)));
      bar.style.width = `${v}%`;
      pct.textContent = `${v}%`;
      raf = requestAnimationFrame(advance);
    };
    raf = requestAnimationFrame(advance);

    at(2300, () => { if (!finished) stageText.textContent = '装载插件'; });
    at(2900, () => { if (!finished) stageText.textContent = '恢复会话'; });

    at(3600, ready);
  }

  /* 落定瞬间的冲击波：以品牌标中心为圆心 */
  function burstShock() {
    if (REDUCED) return;
    const mark = document.querySelector('.mark');
    const r = mark.getBoundingClientRect();
    const layer = document.getElementById('shockLayer');
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    for (let i = 0; i < 3; i++) {
      const ring = document.createElement('span');
      ring.className = i ? `shock shock--${i + 1}` : 'shock';
      ring.style.left = `${cx}px`;
      ring.style.top = `${cy}px`;
      ring.addEventListener('animationend', () => ring.remove());
      layer.appendChild(ring);
    }
  }

  function ready() {
    if (finished) return;
    finished = true;
    cancelAnimationFrame(raf);
    bar.style.width = '100%';
    pct.textContent = '100%';
    stageText.textContent = '就绪';
    at(560, () => splash.classList.add('is-out'));
    at(1180, () => {
      splash.classList.add('is-done');
      document.body.classList.add('show-after');
    });
  }

  function skip() { ready(); }

  function replay() {
    document.body.classList.remove('show-after');
    timers.forEach(clearTimeout);
    timers = [];
    splash.classList.remove('is-out', 'is-done');
    splash.querySelectorAll('[class]').forEach((el) => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
    start();
  }

  splash.addEventListener('pointerdown', skip);
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); skip(); }
  });
  document.getElementById('replay').addEventListener('click', (e) => {
    e.stopPropagation();
    replay();
  });

  // 调试钩子：__whale.at(1500) 定格到某毫秒（截图核对用）
  window.__whale = {
    splashAt,
    exitPoint,
    burstShock,
    at(ms) {
      finished = true;
      cancelAnimationFrame(raf);
      timers.forEach(clearTimeout);
      timers = [];
      splash.classList.remove('is-out', 'is-done');
      document.body.classList.remove('show-after');
      document.getAnimations().forEach((a) => { a.pause(); a.currentTime = ms; });
      const k = Math.min(1, Math.max(0, (ms - 1750) / 1900));
      const v = ms >= 3600 ? 100 : Math.round(88 * (1 - Math.pow(1 - k, 2)));
      bar.style.width = `${v}%`;
      pct.textContent = `${v}%`;
      stageText.textContent =
        ms >= 3600 ? '就绪' : ms >= 2900 ? '恢复会话' : ms >= 2300 ? '装载插件' : '正在唤醒内核';
    },
  };

  start();
})();
</script>
</body>
</html>
