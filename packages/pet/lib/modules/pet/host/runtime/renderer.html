<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src pet-asset:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DSH Pet</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <main id="surface">
    <div id="silhouette" aria-hidden="true">
      <div id="silhouette-body"></div>
      <svg class="shoulder shoulder-left" viewBox="0 0 1 1" preserveAspectRatio="none"><path d="M0 0Q1 0 1 1V0Z" /></svg>
      <svg class="shoulder shoulder-right" viewBox="0 0 1 1" preserveAspectRatio="none"><path d="M1 0Q0 0 0 1V0Z" /></svg>
    </div>
    <button id="cap" type="button">
      <span id="brand" aria-hidden="true"><canvas id="sprite" width="128" height="139"></canvas><img id="film" alt="" hidden></span>
      <span id="camera-space" aria-hidden="true"></span>
      <span id="badge" aria-hidden="true"><span id="badge-icon"></span><span id="badge-text"></span></span>
    </button>
    <section id="activity" aria-live="polite">
      <header id="activity-heading"><span id="activity-label"></span><span id="session-count"></span></header>
      <div id="sessions"></div>
      <p id="error" role="alert"></p>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
