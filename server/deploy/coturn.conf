# coturn 配置片段（/etc/turnserver.conf）—— 可选组件，只用于 WebRTC 打洞。
# 不用 TURN 也能工作：客户端在打洞失败时自动回落 Relay（经 Server 中转）。
#
# 安装：sudo apt install coturn，然后编辑 /etc/default/coturn 打开 TURN_SERVER_ENABLED,
# 再把本文件内容合并进 /etc/turnserver.conf，systemctl enable --now coturn。
#
# 防火墙（以 ufw 为例）：
#   sudo ufw allow 3478/udp
#   sudo ufw allow 5349/tcp
#   sudo ufw allow 49152:65535/udp
#
# 与 Server 的对接（二选一）：
#   A. 推荐：DSH_SERVER_TURN_SECRET 与下面 static-auth-secret 相同，
#      Server 每次向客户端签发短期凭据，secret 不离开服务器；
#   B. 静态账号：DSH_SERVER_TURN_USERNAME / DSH_SERVER_TURN_PASSWORD 与下面 lt-cred-mech 的 user= 对应。
# TURN_URLS 必须与这里监听的端口/传输一致，例如：
#   turn:turn.example.com:3478?transport=udp,turns:turn.example.com:5349

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# A 方案：短期凭据（REST API），值与 DSH_SERVER_TURN_SECRET 一致。
use-auth-secret
static-auth-secret=replace-with-a-long-random-secret
# B 方案：静态账号（与上面两行二选一）。
# user=remote:replace-with-a-long-random-password

realm=turn.example.com
server-name=turn.example.com

# 云主机必须写公网 IP，否则返回的 relay 候选地址不可达。
external-ip=203.0.113.10

min-port=49152
max-port=65535

# TLS（turns:5349）：证书路径按实际签发方式调整。
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# 安全：关掉 CLI、禁止探测内网与本机地址。
no-cli
no-multicast-peers
no-loopback-peers

# 日志（排查打洞失败时先把日志级别调到 info）。
log-file=/var/log/turnserver.log
simple-log
