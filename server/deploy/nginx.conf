# Nginx 反代示例（/etc/nginx/conf.d/dsh-server.conf）
#
# 替换 remote.example.com 与证书路径后：
#   sudo nginx -t && sudo systemctl reload nginx
#
# 要点：
#   - WebSocket 必须走 HTTP/1.1 并转发 Upgrade/Connection，否则手机连上就断；
#   - X-Forwarded-For 必须是**单个** IP 且覆盖原值（用 $remote_addr，不要 $proxy_add_x_forwarded_for），
#     Server 的 TRUSTED_PROXY_IPS 只接受一个 IP 字面量；
#   - 配对/控制帧很小（Server 上限 8192B），client_max_body_size 给 16k 就够，别放大；
#   - 不要加 auth_basic：配对 proof 自己鉴权，额外 401 会让配对直接失败。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name remote.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Debian 12 / Ubuntu 22.04 自带 nginx 1.18–1.22，用 `listen ... http2`；
    # nginx >= 1.25.1 请改成 `listen 443 ssl;` + `http2 on;`（旧写法只剩 deprecation 警告）。
    listen 443 ssl http2;
    server_name remote.example.com;

    ssl_certificate     /etc/letsencrypt/live/remote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket：升级头 + 关闭缓冲 + 长读超时。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
